name: Publish audiobookshelf-modern-ui image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: audiobookshelf-modern-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  code: read
  packages: write

jobs:
  check:
    if: github.repository == 'felixfoertsch/audiobookshelf-modern-ui' && github.ref == 'refs/heads/main'
    runs-on: linux-builder
    container: gitea/runner-images@sha256:0e62e56b382ebf485bff1e51a05cbe27c708545a2e91425467fd31eb3e249521
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          docker buildx create --name frontend --driver remote docker-container://linux-builder-buildkit --use
          docker buildx build --builder frontend --platform linux/amd64 --target check .
  publish:
    needs: check
    if: github.repository == 'felixfoertsch/audiobookshelf-modern-ui' && github.ref == 'refs/heads/main'
    runs-on: linux-builder
    container: gitea/runner-images@sha256:0e62e56b382ebf485bff1e51a05cbe27c708545a2e91425467fd31eb3e249521
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      REGISTRY: git.felixfoertsch.de
      IMAGE: git.felixfoertsch.de/felixfoertsch/audiobookshelf-modern-ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build runtime and E2E images
        run: |
          set -euo pipefail
          docker buildx create --name frontend --driver remote docker-container://linux-builder-buildkit --use
          docker buildx build --builder frontend --platform linux/amd64 --load --target runtime \
            --label org.opencontainers.image.source=https://git.felixfoertsch.de/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t modern-ui-e2e:frontend .
          docker buildx build --builder frontend --platform linux/amd64 --load --target e2e-abs-mock -t modern-ui-e2e:abs .
          docker buildx build --builder frontend --platform linux/amd64 --load --target e2e-psb-mock -t modern-ui-e2e:psb .
          docker pull mcr.microsoft.com/playwright:v1.64.1-noble
          docker pull oven/bun:1.4.3
      - name: Run full Playwright suite against built proxy image
        run: e2e/run-container-suite.sh
      - name: Publish image
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker tag modern-ui-e2e:frontend "$IMAGE:main"
          docker tag modern-ui-e2e:frontend "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-${{ github.sha }}"
